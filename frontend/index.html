    function resolveApiBase() {
      if (typeof window !== 'undefined') {
        try {
          const params = new URLSearchParams(window.location.search);
          const override = params.get('api') || params.get('backend');
          if (override) return override.replace(/\/+$/, '');
        } catch (_) {}

        if (window.__API_BASE__) return window.__API_BASE__.replace(/\/+$/, '');
        if (window.location.protocol === 'file:') return 'http://localhost:5000';
      }
      return '';
    }
    const API_BASE = resolveApiBase();

    // Safe JSON fetch wrapper with robust error detection
    async function safeFetchJson(url, options = {}) {
      const res = await fetch(url, options);
      const text = await res.text();
      let data = null;
      try {
        data = text ? JSON.parse(text) : null;
      } catch (_) {}

      if (!data) {
        if (res.status === 404 || res.status === 405) {
          throw new Error(
            `Service endpoint unavailable (HTTP ${res.status}). Please wait a few moments while the server initializes and try again.`
          );
        }
        if (res.status === 502 || res.status === 503 || res.status === 504) {
          throw new Error(
            'The AI service is temporarily busy or spinning up on Render. Please wait a moment and try again.'
          );
        }
        if (!res.ok) {
          throw new Error(`Server returned HTTP ${res.status}: ${res.statusText || 'Request failed'}`);
        }
        throw new Error('Received an empty response from the server. Please try again.');
      }
      return { ok: res.ok, status: res.status, data };
    }

    // Reusable KaTeX Math Renderer Component
    function MathText({ content, className = '' }) {
      if (!content || typeof content !== 'string') return <span>{content}</span>;

      const renderMath = (mathStr, displayMode) => {
        try {
          if (window.katex) {
            return window.katex.renderToString(mathStr.trim(), {
              displayMode,
              throwOnError: false,
              output: 'htmlAndMathml',
            });
          }
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
        return mathStr;
      };

      const parsedHtml = useMemo(() => {
        const blockRegex = /\$\$([\s\S]+?)\$\$/g;
        let lastIndex = 0;
        let htmlParts = [];
        let match;

        const processInlineAndText = (textChunk) => {
          if (!textChunk) return '';
          const inlineRegex = /\$([^\$\n]+?)\$/g;
          let inlineLastIndex = 0;
          let inlineHtml = '';
          let inlineMatch;

          while ((inlineMatch = inlineRegex.exec(textChunk)) !== null) {
            const plainText = textChunk.slice(inlineLastIndex, inlineMatch.index);
            inlineHtml += escapeAndFormatText(plainText);
            inlineHtml += renderMath(inlineMatch[1], false);
            inlineLastIndex = inlineRegex.lastIndex;
          }

          inlineHtml += escapeAndFormatText(textChunk.slice(inlineLastIndex));
          return inlineHtml;
        };

        const escapeAndFormatText = (str) => {
          if (!str) return '';
          let escaped = str
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
          
          escaped = escaped.replace(/\*\*(.+?)\*\*/g, '<strong class="text-white font-semibold">$1</strong>');
          escaped = escaped.replace(/\*([^\*]+?)\*/g, '<em class="text-slate-300">$1</em>');
          escaped = escaped.replace(/\n/g, '<br />');
          return escaped;
        };

        while ((match = blockRegex.exec(content)) !== null) {
          const textBefore = content.slice(lastIndex, match.index);
          htmlParts.push(processInlineAndText(textBefore));
          const mathBlock = renderMath(match[1], true);
          htmlParts.push(`<div class="my-3 overflow-x-auto text-center">${mathBlock}</div>`);
          lastIndex = blockRegex.lastIndex;
        }

        htmlParts.push(processInlineAndText(content.slice(lastIndex)));
        return htmlParts.join('');
      }, [content]);

      return <span className={className} dangerouslySetInnerHTML={{ __html: parsedHtml }} />;
    }

    // Exam Badge Component
    function ExamBadge({ label, variant, difficulty, questionType, sourceType }) {
      let styleClasses = 'bg-slate-800 text-slate-300 border-slate-700';

      if (variant === 'type') {
        if (questionType === 'MSQ') {
          styleClasses = 'bg-purple-950/90 text-purple-300 border-purple-700 font-bold';
        } else if (questionType === 'NAT') {
          styleClasses = 'bg-teal-950/90 text-teal-300 border-teal-700 font-bold';
        } else {
          styleClasses = 'bg-indigo-950/90 text-indigo-300 border-indigo-700 font-bold';
        }
      } else if (variant === 'difficulty' && difficulty) {
        if (difficulty === 'Easy') styleClasses = 'bg-emerald-950/80 text-emerald-300 border-emerald-700/60';
        else if (difficulty === 'Medium') styleClasses = 'bg-amber-950/80 text-amber-300 border-amber-700/60';
        else styleClasses = 'bg-rose-950/80 text-rose-300 border-rose-700/60';
      } else if (variant === 'source') {
        if (sourceType === 'PYQ') {
          styleClasses = 'bg-blue-950/90 text-blue-300 border-blue-600 font-bold';
        } else if (sourceType === 'AI_GENERATED') {
          styleClasses = 'bg-fuchsia-950/90 text-fuchsia-300 border-fuchsia-600 font-bold';
        } else {
          styleClasses = 'bg-slate-800 text-slate-400 border-slate-700 font-medium';
        }
      } else if (variant === 'primary') {
        styleClasses = 'bg-brand-950 text-brand-300 border-brand-700/60 font-semibold';
      } else if (variant === 'subject') {
        styleClasses = 'bg-slate-800/90 text-slate-200 border-slate-700';
      }

      return (
        <span className={`inline-flex items-center px-2.5 py-0.5 rounded-md text-xs font-mono border tracking-wide uppercase ${styleClasses}`}>
          {label}
        </span>
      );
    }

    function ImportModal({ isOpen, onClose, onImportSuccess }) {
      const [jsonText, setJsonText] = useState('');
      const [isImporting, setIsImporting] = useState(false);
      const [importSummary, setImportSummary] = useState(null);
      const [error, setError] = useState(null);

      if (!isOpen) return null;

      const sampleTemplate = `[
  {
    "question": "What is the time complexity of building a heap of $n$ elements using the bottom-up Heapify approach?",
    "subject": "Algorithms",
    "topic": "Heaps and Priority Queues",
    "subtopic": "Build-Heap Time Complexity",
    "concepts": ["heapify", "binary heap", "sum of infinite series", "time complexity"],
    "year": 2024,
    "exam": "GATE CS",
    "paper": "CS",
    "questionNumber": 25,
    "questionType": "MCQ",
    "difficulty": "Medium",
    "options": [
      "$\\\\Theta(n \\\\log_2 n)$",
      "$\\\\Theta(n)$",
      "$\\\\Theta(n^2)$",
      "$\\\\Theta(\\\\log_2 n)$"
    ],
    "correctAnswer": "B",
    "explanation": "Building a heap bottom-up takes $\\\\sum_{h=0}^{\\\\lfloor \\\\log n \\\\rfloor} \\\\lceil n / 2^{h+1} \\\\rceil O(h) = O(n \\\\sum_{h=0}^\\\\infty h / 2^h) = O(n)$.",
    "source": {
      "type": "PYQ",
      "exam": "GATE",
      "year": 2024,
      "paper": "CS",
      "questionNumber": 25
    },
    "reasoningType": ["calculation", "conceptual"]
  }
]`;

      const handlePasteSample = () => {
        setJsonText(sampleTemplate);
        setError(null);
        setImportSummary(null);
      };

      const handleRunImport = async () => {
        setError(null);
        setImportSummary(null);

        let parsed;
        try {
          parsed = JSON.parse(jsonText);
        } catch (e) {
          setError('Invalid JSON syntax: ' + e.message);
          return;
        }

        if (!Array.isArray(parsed)) {
          setError('Top-level JSON must be an array of question objects.');
          return;
        }

        setIsImporting(true);
        try {
          const res = await fetch(`${API_BASE}/api/questions/import`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ questions: parsed }),
          });
          const json = await res.json();
          if (json.success) {
            setImportSummary(json.summary);
            if (onImportSuccess) onImportSuccess();
          } else {
            setError(json.error || 'Import failed');
          }
        } catch (err) {
          setError('Network/API error: ' + err.message);
        } finally {
          setIsImporting(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm overflow-y-auto">
          <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-3xl w-full p-6 shadow-2xl my-8">
            <div className="flex items-center justify-between pb-4 mb-4 border-b border-slate-800">
              <div className="flex items-center space-x-2.5">
                <div className="p-2 rounded-xl bg-brand-500/10 text-brand-400 border border-brand-500/30">
                  <Icons.Upload />
                </div>
                <div>
                  <h3 className="text-lg font-bold text-white">Bulk Question Import (JSON)</h3>
                  <p className="text-xs text-slate-400 font-mono">Import structured previous year questions (PYQ) or manual questions</p>
                </div>
              </div>
              <button onClick={onClose} className="p-2 rounded-lg hover:bg-slate-800 text-slate-400 hover:text-white cursor-pointer">
                <Icons.X />
              </button>
            </div>

            {error && (
              <div className="p-3.5 mb-4 rounded-xl bg-rose-950/40 border border-rose-800 text-xs text-rose-300">
                <strong>Error:</strong> {error}
              </div>
            )}

            {importSummary && (
              <div className="p-4 mb-4 rounded-xl bg-emerald-950/30 border border-emerald-800/60 text-xs text-emerald-200">
                <div className="font-bold text-sm mb-2 text-emerald-300">Import Summary:</div>
                <div className="grid grid-cols-4 gap-2 font-mono mb-2">
                  <span className="p-2 bg-slate-950/60 rounded border border-slate-800">Total: {importSummary.total}</span>
                  <span className="p-2 bg-emerald-950/60 rounded border border-emerald-800 text-emerald-300">Imported: {importSummary.imported}</span>
                  <span className="p-2 bg-amber-950/60 rounded border border-amber-800 text-amber-300">Duplicates: {importSummary.duplicates}</span>
                  <span className="p-2 bg-rose-950/60 rounded border border-rose-800 text-rose-300">Failed: {importSummary.failed}</span>
                </div>
                {importSummary.errors.length > 0 && (
                  <div className="mt-2 text-rose-300 space-y-1">
                    <strong className="block">Validation Issues:</strong>
                    {importSummary.errors.map(err => (
                      <div key={err.index}>• Record {err.index + 1}: {err.errors.join(', ')}</div>
                    ))}
                  </div>
                )}
                {importSummary.duplicateDetails.length > 0 && (
                  <div className="mt-2 text-amber-300 space-y-1">
                    <strong className="block">Duplicates Skipped:</strong>
                    {importSummary.duplicateDetails.map(dup => (
                      <div key={dup.index}>• Record {dup.index + 1}: {dup.reason}</div>
                    ))}
                  </div>
                )}
              </div>
            )}

            <div className="mb-4">
              <div className="flex items-center justify-between text-xs text-slate-400 font-mono mb-1.5">
                <span>Paste JSON Array:</span>
                <button onClick={handlePasteSample} className="text-brand-400 hover:text-brand-300 underline cursor-pointer">
                  Insert Sample PYQ Template
                </button>
              </div>
              <textarea
                value={jsonText}
                onChange={(e) => setJsonText(e.target.value)}
                placeholder='[ { "question": "...", "subject": "DBMS", "topic": "...", "questionType": "MCQ", "options": [...], "correctAnswer": "A", "explanation": "..." } ]'
                rows={10}
                className="w-full p-3.5 rounded-xl bg-slate-950 border border-slate-800 font-mono text-xs text-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500"
              />
            </div>

            <div className="flex items-center justify-end space-x-3 pt-2">
              <button onClick={onClose} className="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 cursor-pointer">
                Close
              </button>
              <button
                onClick={handleRunImport}
                disabled={!jsonText.trim() || isImporting}
                className="px-5 py-2 rounded-xl text-xs font-bold bg-brand-500 hover:bg-brand-400 text-white disabled:opacity-40 transition cursor-pointer"
              >
                {isImporting ? 'Validating & Importing...' : 'Validate & Import'}
              </button>
            </div>
          </div>
        </div>
      );
    }

    // Question Bank Page (Phase 2 & Phase 3B)
    function QuestionBankPage({ onStartPracticeWithFilter }) {
      const [questions, setQuestions] = useState([]);
      const [pagination, setPagination] = useState({ page: 1, limit: 10, total: 0, totalPages: 1 });
      const [taxonomy, setTaxonomy] = useState({ subjects: [], questionTypes: [], difficultyLevels: [], sourceTypes: [] });
      const [selectedSubject, setSelectedSubject] = useState('');
      const [selectedType, setSelectedType] = useState('');
      const [selectedDifficulty, setSelectedDifficulty] = useState('');
      const [selectedSource, setSelectedSource] = useState('');
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedAIStatus, setSelectedAIStatus] = useState(''); // '', 'true', 'false'
      const [expandedQuestionId, setExpandedQuestionId] = useState(null);
      const [isLoading, setIsLoading] = useState(true);
      const [isImportModalOpen, setIsImportModalOpen] = useState(false);
      const [selectedQuestionForAI, setSelectedQuestionForAI] = useState(null);
      const [analyzingQuestionIds, setAnalyzingQuestionIds] = useState({});
      const [isModalAnalyzing, setIsModalAnalyzing] = useState(false);

      useEffect(() => {
        fetchTaxonomy();
      }, []);

      useEffect(() => {
        loadBankQuestions(pagination.page);
      }, [selectedSubject, selectedType, selectedDifficulty, selectedSource, selectedAIStatus, searchQuery, pagination.page]);

      const fetchTaxonomy = async () => {
        try {
          const res = await fetch(`${API_BASE}/api/taxonomy`);
          const json = await res.json();
          if (json.success && json.data) {
            setTaxonomy(json.data);
          }
        } catch (e) {
          console.warn('Could not fetch taxonomy:', e);
        }
      };

      const loadBankQuestions = async (page = 1) => {
        setIsLoading(true);
        try {
          const params = new URLSearchParams();
          params.append('page', String(page));
          params.append('limit', String(pagination.limit));
          params.append('includeAnswer', 'true');

          if (selectedSubject) params.append('subject', selectedSubject);
          if (selectedType) params.append('questionType', selectedType);
          if (selectedDifficulty) params.append('difficulty', selectedDifficulty);
          if (selectedSource) params.append('sourceType', selectedSource);
          if (selectedAIStatus) params.append('analyzed', selectedAIStatus);
          if (searchQuery.trim()) params.append('search', searchQuery.trim());

          const res = await fetch(`${API_BASE}/api/questions?${params.toString()}`);
          const json = await res.json();

          if (json.success) {
            setQuestions(json.data || []);
            if (json.pagination) {
              setPagination(json.pagination);
            }
          }
        } catch (err) {
          console.error('Error loading question bank:', err);
        } finally {
          setIsLoading(false);
        }
      };

      const handleAnalyzeSingleQuestion = async (questionId, force = false) => {
        setAnalyzingQuestionIds(prev => ({ ...prev, [questionId]: true }));
        try {
          const res = await fetch(`${API_BASE}/api/ai/analyze-question/${questionId}${force ? '?force=true' : ''}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
          });
          const json = await res.json();
          if (json.success && json.data?.aiAnalysis) {
            setQuestions(prev => prev.map(q => q.id === questionId ? { ...q, aiAnalysis: json.data.aiAnalysis } : q));
            if (selectedQuestionForAI?.id === questionId) {
              setSelectedQuestionForAI(prev => ({ ...prev, aiAnalysis: json.data.aiAnalysis }));
            }
          }
        } catch (err) {
          console.error('Single question analysis failed:', err);
        } finally {
          setAnalyzingQuestionIds(prev => ({ ...prev, [questionId]: false }));
        }
      };

      const handleModalReanalyze = async (questionId) => {
        setIsModalAnalyzing(true);
        await handleAnalyzeSingleQuestion(questionId, true);
        setIsModalAnalyzing(false);
      };

      const handleResetFilters = () => {
        setSelectedSubject('');
        setSelectedType('');
        setSelectedDifficulty('');
        setSelectedSource('');
        setSelectedAIStatus('');
        setSearchQuery('');
        setPagination(prev => ({ ...prev, page: 1 }));
      };

      return (
        <div className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
          <QuestionAIModal
            isOpen={!!selectedQuestionForAI}
            question={selectedQuestionForAI}
            onClose={() => setSelectedQuestionForAI(null)}
            onReanalyze={handleModalReanalyze}
            isAnalyzing={isModalAnalyzing || analyzingQuestionIds[selectedQuestionForAI?.id]}
          />

          <ImportModal
            isOpen={isImportModalOpen}
            onClose={() => setIsImportModalOpen(false)}
            onImportSuccess={() => loadBankQuestions(1)}
          />

          {/* Header & Stats Banner */}
          <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 mb-8">
            <div>
              <div className="flex items-center space-x-2">
                <span className="px-2 py-0.5 rounded text-[10px] font-mono font-bold uppercase bg-brand-950 text-brand-400 border border-brand-800">
                  Data Foundation
                </span>
                <h1 className="text-2xl sm:text-3xl font-extrabold text-white">GATE CS Question Bank</h1>
              </div>
              <p className="text-xs text-slate-400 font-mono mt-1">
                Browse, filter, and inspect structured GATE questions with concepts, LaTeX notation, and provenance.
              </p>
            </div>

            <button
              onClick={() => setIsImportModalOpen(true)}
              className="inline-flex items-center space-x-2 px-4 py-2.5 rounded-xl text-xs font-bold bg-brand-500 hover:bg-brand-400 text-white shadow-lg shadow-brand-500/20 transition cursor-pointer"
            >
              <Icons.Upload />
              <span>Import Questions (JSON)</span>
            </button>
          </div>

          {/* Filter Bar */}
          <div className="bg-slate-900/90 border border-slate-800 rounded-2xl p-5 mb-8 shadow-sm">
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3 mb-4">
              {/* Search */}
              <div className="lg:col-span-2 relative">
                <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-500">
                  <Icons.Search />
                </div>
                <input
                  type="text"
                  value={searchQuery}
                  onChange={(e) => {
                    setSearchQuery(e.target.value);
                    setPagination(p => ({ ...p, page: 1 }));
                  }}
                  placeholder="Search question text, topic, concept..."
                  className="w-full pl-9 pr-4 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-xs text-white placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-brand-500"
                />
              </div>

              {/* Subject Select */}
              <div>
                <select
                  value={selectedSubject}
                  onChange={(e) => {
                    setSelectedSubject(e.target.value);
                    setPagination(p => ({ ...p, page: 1 }));
                  }}
                  className="w-full px-3 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-xs text-slate-200 focus:outline-none focus:ring-1 focus:ring-brand-500 font-mono"
                >
                  <option value="">All Subjects</option>
                  {(taxonomy.subjects || []).map(subj => (
                    <option key={subj} value={subj}>{subj}</option>
                  ))}
                </select>
              </div>

              {/* Type Select */}
              <div>
                <select
                  value={selectedType}
                  onChange={(e) => {
                    setSelectedType(e.target.value);
                    setPagination(p => ({ ...p, page: 1 }));
                  }}
                  className="w-full px-3 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-xs text-slate-200 focus:outline-none focus:ring-1 focus:ring-brand-500 font-mono"
                >
                  <option value="">All Question Types</option>
                  <option value="MCQ">MCQ (Single Choice)</option>
                  <option value="MSQ">MSQ (Multi Select)</option>
                  <option value="NAT">NAT (Numerical)</option>
                </select>
              </div>

              {/* Difficulty Select */}
              <div>
                <select
                  value={selectedDifficulty}
                  onChange={(e) => {
                    setSelectedDifficulty(e.target.value);
                    setPagination(p => ({ ...p, page: 1 }));
                  }}
                  className="w-full px-3 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-xs text-slate-200 focus:outline-none focus:ring-1 focus:ring-brand-500 font-mono"
                >
                  <option value="">All Difficulties</option>
                  <option value="Easy">Easy</option>
                  <option value="Medium">Medium</option>
                  <option value="Hard">Hard</option>
                </select>
              </div>
            </div>

            {/* Filter Pills & Reset */}
            <div className="flex flex-wrap items-center justify-between gap-3 pt-3 border-t border-slate-800 text-xs font-mono">
              <div className="flex flex-wrap items-center gap-3 text-slate-400">
                <div className="flex items-center space-x-1">
                  <span>Source:</span>
                  <button
                    onClick={() => setSelectedSource('')}
                    className={`px-2 py-1 rounded-md transition ${!selectedSource ? 'bg-slate-800 text-white font-bold' : 'hover:text-slate-200'}`}
                  >
                    All
                  </button>
                  <button
                    onClick={() => setSelectedSource('PYQ')}
                    className={`px-2 py-1 rounded-md transition ${selectedSource === 'PYQ' ? 'bg-blue-950 text-blue-300 font-bold border border-blue-800' : 'hover:text-slate-200'}`}
                  >
                    PYQ
                  </button>
                  <button
                    onClick={() => setSelectedSource('MANUAL')}
                    className={`px-2 py-1 rounded-md transition ${selectedSource === 'MANUAL' ? 'bg-slate-800 text-slate-200 font-bold border border-slate-700' : 'hover:text-slate-200'}`}
                  >
                    Manual / Dev
                  </button>
                </div>

                <div className="flex items-center space-x-1 pl-2 border-l border-slate-800">
                  <span className="text-purple-400 flex items-center space-x-1"><Icons.Brain /><span>AI Status:</span></span>
                  <button
                    onClick={() => setSelectedAIStatus('')}
                    className={`px-2 py-1 rounded-md transition ${!selectedAIStatus ? 'bg-purple-950 text-purple-300 font-bold border border-purple-800' : 'hover:text-slate-200'}`}
                  >
                    All
                  </button>
                  <button
                    onClick={() => setSelectedAIStatus('true')}
                    className={`px-2 py-1 rounded-md transition ${selectedAIStatus === 'true' ? 'bg-purple-900 text-white font-bold border border-purple-600' : 'hover:text-purple-300'}`}
                  >
                    ✦ Analyzed
                  </button>
                  <button
                    onClick={() => setSelectedAIStatus('false')}
                    className={`px-2 py-1 rounded-md transition ${selectedAIStatus === 'false' ? 'bg-slate-800 text-slate-300 font-bold border border-slate-700' : 'hover:text-slate-200'}`}
                  >
                    Unanalyzed
                  </button>
                </div>
              </div>

              <div className="flex items-center space-x-4">
                <span className="text-slate-400">Showing <strong className="text-white">{questions.length}</strong> of <strong className="text-brand-400">{pagination.total}</strong> questions</span>
                <button
                  onClick={handleResetFilters}
                  className="text-xs text-brand-400 hover:text-brand-300 underline cursor-pointer"
                >
                  Reset Filters
                </button>
              </div>
            </div>
          </div>

          {/* Question List */}
          {isLoading ? (
            <div className="py-16 text-center">
              <div className="w-8 h-8 border-2 border-brand-500 border-t-transparent rounded-full animate-spin mx-auto mb-3" />
              <p className="text-xs text-slate-400 font-mono">Loading questions...</p>
            </div>
          ) : questions.length === 0 ? (
            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-12 text-center">
              <Icons.Database />
              <h3 className="text-base font-bold text-white mt-3 mb-1">No Questions Found</h3>
              <p className="text-xs text-slate-400 mb-4">No questions match the selected filter criteria.</p>
              <button onClick={handleResetFilters} className="px-4 py-2 rounded-xl text-xs font-semibold bg-brand-500 text-white">
                Clear Filters
              </button>
            </div>
          ) : (
            <div className="space-y-4 mb-8">
              {questions.map((q, idx) => {
                const isExpanded = expandedQuestionId === q.id;
                const source = q.source || {};
                const isAnalyzed = Boolean(q.aiAnalysis?.analyzed);
                const isAnalyzingThis = Boolean(analyzingQuestionIds[q.id]);

                return (
                  <div
                    key={q.id}
                    className="bg-slate-900/80 border border-slate-800 hover:border-slate-700/80 rounded-2xl p-5 transition-all shadow-sm"
                  >
                    <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
                      <div className="flex flex-wrap items-center gap-2">
                        <span className="font-mono text-xs font-bold text-brand-400">#{(pagination.page - 1) * pagination.limit + idx + 1}</span>
                        <ExamBadge label={q.questionType} variant="type" questionType={q.questionType} />
                        <ExamBadge label={source.type || 'MANUAL'} variant="source" sourceType={source.type || 'MANUAL'} />
                        <ExamBadge label={q.subject} variant="subject" />
                        <ExamBadge label={q.difficulty} variant="difficulty" difficulty={q.difficulty} />
                        <span className="px-2 py-0.5 rounded text-xs font-mono bg-slate-950 text-slate-400 border border-slate-800">
                          {q.year || source.year || 2024}
                        </span>

                        {/* AI Intel Badge / Action */}
                        {isAnalyzed ? (
                          <button
                            onClick={() => setSelectedQuestionForAI(q)}
                            className="px-2 py-0.5 rounded text-[11px] font-mono font-bold bg-purple-950/80 text-purple-300 border border-purple-700 hover:bg-purple-900/70 transition flex items-center space-x-1 cursor-pointer"
                            title="View extracted GATE pattern profile & solution strategy"
                          >
                            <Icons.Brain />
                            <span>✦ AI Intel</span>
                          </button>
                        ) : (
                          <button
                            onClick={() => handleAnalyzeSingleQuestion(q.id)}
                            disabled={isAnalyzingThis}
                            className="px-2 py-0.5 rounded text-[11px] font-mono font-semibold bg-slate-800 hover:bg-purple-950 text-slate-300 hover:text-purple-300 border border-slate-700 hover:border-purple-800 transition flex items-center space-x-1 cursor-pointer disabled:opacity-50"
                            title="Analyze question with Gemini"
                          >
                            <Icons.Brain />
                            <span>{isAnalyzingThis ? 'Analyzing...' : 'Analyze'}</span>
                          </button>
                        )}
                      </div>

                      <button
                        onClick={() => setExpandedQuestionId(isExpanded ? null : q.id)}
                        className="text-xs font-mono font-bold text-brand-400 hover:text-brand-300 transition cursor-pointer flex items-center space-x-1"
                      >
                        <span>{isExpanded ? 'Hide Details' : 'View Details & Solution'}</span>
                      </button>
                    </div>

                    {/* Question Text */}
                    <div className="text-sm sm:text-base text-slate-100 mb-3 leading-relaxed">
                      <MathText content={q.question} />
                    </div>

                    {/* Concepts & Topic Tags */}
                    <div className="flex flex-wrap items-center gap-1.5 mb-2">
                      <span className="text-[11px] font-mono text-slate-400 mr-1 flex items-center space-x-1">
                        <Icons.Tag />
                        <span>Topic:</span>
                      </span>
                      <span className="px-2 py-0.5 rounded bg-slate-950 border border-slate-800 text-[11px] font-mono text-slate-300">
                        {q.topic} {q.subtopic ? `• ${q.subtopic}` : ''}
                      </span>

                      {(q.concepts || []).map(concept => (
                        <span key={concept} className="px-2 py-0.5 rounded-full bg-brand-950/60 border border-brand-800/40 text-[10px] font-mono text-brand-300">
                          {concept}
                        </span>
                      ))}
                    </div>

                    {/* Expandable Details Drawer */}
                    {isExpanded && (
                      <div className="mt-4 pt-4 border-t border-slate-800 space-y-4">
                        {/* Options if MCQ/MSQ */}
                        {q.options && q.options.length > 0 && (
                          <div>
                            <div className="text-xs font-mono uppercase text-slate-400 font-bold mb-2">Options:</div>
                            <div className="space-y-1.5">
                              {q.options.map(opt => {
                                const isCorrect = Array.isArray(q.correctAnswer)
                                  ? q.correctAnswer.includes(opt.id)
                                  : q.correctAnswer === opt.id;

                                return (
                                  <div
                                    key={opt.id}
                                    className={`p-2.5 rounded-xl border text-xs flex items-start space-x-2.5 ${
                                      isCorrect
                                        ? 'bg-emerald-950/30 border-emerald-600 text-emerald-100 font-medium'
                                        : 'bg-slate-950/60 border-slate-800 text-slate-300'
                                    }`}
                                  >
                                    <span className="font-mono font-bold">{opt.id}.</span>
                                    <div className="flex-1"><MathText content={opt.text} /></div>
                                    {isCorrect && (
                                      <span className="text-emerald-400 font-mono text-[10px] uppercase font-bold">
                                        Correct
                                      </span>
                                    )}
                                  </div>
                                );
                              })}
                            </div>
                          </div>
                        )}

                        {/* NAT Answer details */}
                        {q.questionType === 'NAT' && (
                          <div className="p-3 rounded-xl bg-slate-950 border border-slate-800 text-xs font-mono flex items-center justify-between">
                            <span>Expected Numerical Value: <strong className="text-emerald-400 text-sm">{String(q.correctAnswer)}</strong></span>
                            {q.numericalTolerance && <span className="text-slate-400">Tolerance: ±{q.numericalTolerance}</span>}
                          </div>
                        )}

                        {/* Explanation */}
                        <div className="p-4 rounded-xl bg-slate-950 border border-slate-800 text-xs leading-relaxed text-slate-200">
                          <div className="font-mono uppercase font-bold text-slate-400 mb-1.5 flex items-center space-x-1.5">
                            <Icons.BookOpen />
                            <span>Step-by-Step Explanation:</span>
                          </div>
                          <MathText content={q.explanation} />
                        </div>

                        {/* Provenance Metadata */}
                        <div className="flex flex-wrap items-center gap-3 text-[11px] font-mono text-slate-400 p-2.5 rounded-lg bg-slate-950 border border-slate-850">
                          <span><strong>ID:</strong> {q.id}</span>
                          <span><strong>Source:</strong> {source.type || 'MANUAL'} ({source.exam || 'GATE'} {source.year || 2024} {source.paper ? `Paper: ${source.paper}` : ''} {source.questionNumber ? `Q#${source.questionNumber}` : ''})</span>
                          {q.reasoningType && q.reasoningType.length > 0 && (
                            <span><strong>Reasoning:</strong> {q.reasoningType.join(', ')}</span>
                          )}
                        </div>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          )}

          {/* Pagination Controls */}
          {pagination.totalPages > 1 && (
            <div className="flex items-center justify-between bg-slate-900 border border-slate-800 rounded-xl p-4 font-mono text-xs">
              <button
                onClick={() => setPagination(p => ({ ...p, page: Math.max(1, p.page - 1) }))}
                disabled={pagination.page <= 1 || isLoading}
                className="px-3.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 disabled:opacity-40 disabled:hover:bg-slate-800 transition cursor-pointer"
              >
                Previous Page
              </button>

              <span className="text-slate-400">
                Page <strong className="text-white">{pagination.page}</strong> of <strong className="text-white">{pagination.totalPages}</strong>
              </span>

              <button
                onClick={() => setPagination(p => ({ ...p, page: Math.min(p.totalPages, p.page + 1) }))}
                disabled={pagination.page >= pagination.totalPages || isLoading}
                className="px-3.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 disabled:opacity-40 disabled:hover:bg-slate-800 transition cursor-pointer"
              >
                Next Page
              </button>
            </div>
          )}
        </div>
      );
    }

    // Option Card (MCQ and MSQ)
    function OptionCard({
      option,
      isMSQ,
      isSelected,
      isSubmitted,
      isCorrectOption,
      isUserSelection,
      onSelect,
      disabled,
    }) {
      let containerStyles = 'bg-slate-900/60 border-slate-800 hover:border-slate-700 hover:bg-slate-850/80 text-slate-200';
      let badgeStyles = 'bg-slate-800 text-slate-300 border-slate-700';

      if (!isSubmitted) {
        if (isSelected) {
          containerStyles = 'bg-brand-950/40 border-brand-500 shadow-glow text-white ring-1 ring-brand-500';
          badgeStyles = 'bg-brand-500 text-white font-bold border-brand-400';
        }
      } else {
        if (isCorrectOption) {
          containerStyles = 'bg-emerald-950/30 border-emerald-500 text-emerald-100 shadow-glow-success ring-1 ring-emerald-500';
          badgeStyles = 'bg-emerald-600 text-white font-bold border-emerald-400';
        } else if (isUserSelection && !isCorrectOption) {
          containerStyles = 'bg-rose-950/30 border-rose-500 text-rose-100 shadow-glow-error ring-1 ring-rose-500';
          badgeStyles = 'bg-rose-600 text-white font-bold border-rose-400';
        } else {
          containerStyles = 'bg-slate-900/30 border-slate-850 opacity-50 text-slate-400';
          badgeStyles = 'bg-slate-850 text-slate-500 border-slate-800';
        }
      }

      return (
        <button
          type="button"
          disabled={disabled || isSubmitted}
          onClick={() => onSelect(option.id)}
          className={`w-full text-left p-4 rounded-xl border transition-all duration-200 flex items-start space-x-3.5 cursor-pointer disabled:cursor-default ${containerStyles}`}
        >
          <div className={`w-8 h-8 flex-shrink-0 rounded-lg border flex items-center justify-center font-mono text-sm transition-all ${badgeStyles}`}>
            {isSubmitted && isCorrectOption ? (
              <Icons.Check />
            ) : isSubmitted && isUserSelection && !isCorrectOption ? (
              <Icons.X />
            ) : isMSQ ? (
              isSelected ? <Icons.CheckSquare /> : <span className="font-bold">{option.id}</span>
            ) : (
              option.id
            )}
          </div>
          <div className="flex-1 pt-0.5 font-medium leading-relaxed">
            <MathText content={option.text} />
          </div>
        </button>
      );
    }

    // NAT (Numerical Answer Type) Input Component
    function NATInput({ value, onChange, isSubmitted, evaluation, onSubmit, isSubmitting }) {
      const isCorrect = evaluation?.isCorrect;

      return (
        <div className="space-y-4">
          <div className="bg-slate-900/90 border border-slate-800 rounded-2xl p-6">
            <div className="flex items-center space-x-2 text-xs font-mono uppercase tracking-wider text-teal-400 font-semibold mb-3">
              <Icons.Hash />
              <span>Numerical Answer Input (Decimal / Integer)</span>
            </div>

            {!isSubmitted ? (
              <div className="flex flex-col sm:flex-row items-stretch sm:items-center gap-3">
                <div className="relative flex-1">
                  <input
                    type="number"
                    step="any"
                    value={value || ''}
                    onChange={(e) => onChange(e.target.value)}
                    placeholder="Enter numerical value (e.g. 5.0, 9, 31)"
                    className="w-full px-4 py-3.5 rounded-xl bg-slate-950 border border-slate-700 text-white font-mono text-lg focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition"
                  />
                </div>
              </div>
            ) : (
              <div className="space-y-3">
                <div className={`p-4 rounded-xl border font-mono flex items-center justify-between ${
                  isCorrect ? 'bg-emerald-950/30 border-emerald-600 text-emerald-200' : 'bg-rose-950/30 border-rose-600 text-rose-200'
                }`}>
                  <div>
                    <span className="text-xs uppercase text-slate-400 block mb-1">Your Submitted Value:</span>
                    <span className="text-xl font-bold">{String(evaluation.userAnswer)}</span>
                  </div>
                  <div className="text-right">
                    <span className="text-xs uppercase text-slate-400 block mb-1">Expected Answer:</span>
                    <span className="text-xl font-bold text-emerald-400">{String(evaluation.correctAnswer)}</span>
                  </div>
                </div>
                {evaluation.tolerance && (
                  <div className="text-xs text-slate-400 font-mono">
                    Allowed Numerical Tolerance: ±{evaluation.tolerance}
                  </div>
                )}
              </div>
            )}
          </div>
        </div>
      );
    }

    // Explanation Card Component
    function ExplanationCard({ evaluation }) {
      const { isCorrect, userAnswer, correctAnswer, explanation, questionType } = evaluation;
      const formattedUserAnswer = Array.isArray(userAnswer) ? userAnswer.join(', ') : String(userAnswer);
      const formattedCorrectAnswer = Array.isArray(correctAnswer) ? correctAnswer.join(', ') : String(correctAnswer);

      return (
        <div className={`mt-6 rounded-2xl border transition-all overflow-hidden ${
          isCorrect ? 'bg-emerald-950/20 border-emerald-800/60 shadow-[0_0_30px_rgba(16,185,129,0.1)]' : 'bg-rose-950/20 border-rose-800/60 shadow-[0_0_30px_rgba(244,63,94,0.1)]'
        }`}>
          <div className={`px-5 py-4 flex flex-wrap items-center justify-between gap-3 border-b ${
            isCorrect ? 'bg-emerald-900/30 border-emerald-800/50 text-emerald-300' : 'bg-rose-900/30 border-rose-800/50 text-rose-300'
          }`}>
            <div className="flex items-center space-x-2.5">
              {isCorrect ? <Icons.CheckCircle2 /> : <Icons.XCircle />}
              <span className="font-semibold text-sm tracking-wide">
                {isCorrect ? 'Correct Answer (+1.00 Marks)' : questionType === 'MCQ' ? 'Incorrect Answer (-0.33 Negative Marks)' : 'Incorrect Answer (0.00 Marks)'}
              </span>
            </div>
            <div className="flex items-center space-x-3 text-xs font-mono">
              <span>Your Answer: <strong className="text-white px-1.5 py-0.5 rounded bg-slate-800 border border-slate-700">{formattedUserAnswer || 'None'}</strong></span>
              <span>Correct: <strong className="text-emerald-300 px-1.5 py-0.5 rounded bg-emerald-950 border border-emerald-800">{formattedCorrectAnswer}</strong></span>
            </div>
          </div>
          <div className="p-5 text-slate-200">
            <div className="flex items-center space-x-2 mb-3 text-slate-400">
              <Icons.BookOpen />
              <h4 className="text-xs font-mono uppercase tracking-wider font-semibold text-slate-300">
                Detailed Conceptual Explanation & Mathematical Solution
              </h4>
            </div>
            <div className="bg-slate-900/80 rounded-xl p-4 border border-slate-800 text-sm leading-relaxed font-normal text-slate-200">
              <MathText content={explanation} />
            </div>
            <div className="mt-4 flex items-center space-x-2 text-xs text-slate-400 bg-slate-900/40 p-2.5 rounded-lg border border-slate-800/80">
              <Icons.Lightbulb />
              <span><strong>GATE Tip:</strong> Verify boundary conditions and formal notation to maximize competitive score.</span>
            </div>
          </div>
        </div>
      );
    }

    // Confirmation Modal for Submit Quiz
    function SubmitQuizModal({ isOpen, unansweredCount, onConfirm, onCancel }) {
      if (!isOpen) return null;

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm">
          <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl">
            <div className="flex items-center space-x-3 mb-4">
              <div className="p-2.5 rounded-xl bg-amber-500/10 border border-amber-500/30 text-amber-400">
                <Icons.AlertTriangle />
              </div>
              <h3 className="text-lg font-bold text-white">Submit Practice Quiz?</h3>
            </div>

            <div className="text-sm text-slate-300 leading-relaxed mb-6">
              {unansweredCount > 0 ? (
                <>
                  You still have <strong className="text-amber-400 font-mono font-bold text-base">{unansweredCount}</strong> unanswered / skipped question(s).
                  <br /><br />
                  Unanswered questions will <strong>not</strong> be penalized with negative marks. Are you sure you want to submit your quiz now?
                </>
              ) : (
                <>
                  All questions in this session have been answered. Ready to submit and view your final evaluation and score?
                </>
              )}
            </div>

            <div className="flex items-center justify-end space-x-3">
              <button
                type="button"
                onClick={onCancel}
                className="px-4 py-2.5 rounded-xl text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition cursor-pointer"
              >
                Continue Practice
              </button>
              <button
                type="button"
                onClick={onConfirm}
                className="px-5 py-2.5 rounded-xl text-xs font-bold bg-amber-500 hover:bg-amber-400 text-slate-950 shadow-lg shadow-amber-500/20 transition cursor-pointer"
              >
                Confirm & Submit Quiz
              </button>
            </div>
          </div>
        </div>
      );
    }

    // Practice Page
    function PracticePage({ onBackToHome, isModalOpen, setIsModalOpen }) {
      const [questions, setQuestions] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [evaluations, setEvaluations] = useState({});
      const [userAnswers, setUserAnswers] = useState({});
      const [isLoading, setIsLoading] = useState(true);
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [error, setError] = useState(null);
      const [isQuizSubmitted, setIsQuizSubmitted] = useState(false);
      const [reviewFilter, setReviewFilter] = useState('all');

      useEffect(() => {
        loadQuestions();
      }, []);

      const loadQuestions = async () => {
        setIsLoading(true);
        setError(null);
        try {
          const res = await fetch(`${API_BASE}/api/questions`);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const json = await res.json();
          setQuestions(json.data || []);
          setCurrentIndex(0);
          setEvaluations({});
          setUserAnswers({});
          setIsQuizSubmitted(false);
          setReviewFilter('all');
        } catch (err) {
          setError(err.message || 'Could not connect to backend.');
        } finally {
          setIsLoading(false);
        }
      };

      const currentQuestion = questions[currentIndex];
      const currentEvaluation = currentQuestion ? evaluations[currentQuestion.id] || null : null;
      const currentAnswer = currentQuestion ? userAnswers[currentQuestion.id] : undefined;

      const handleSelectOption = (optionId) => {
        if (currentEvaluation || isQuizSubmitted || isSubmitting || !currentQuestion) return;

        if (currentQuestion.questionType === 'MSQ') {
          const currentList = Array.isArray(currentAnswer) ? [...currentAnswer] : [];
          const exists = currentList.includes(optionId);
          const nextList = exists ? currentList.filter(id => id !== optionId) : [...currentList, optionId].sort();
          setUserAnswers(prev => ({ ...prev, [currentQuestion.id]: nextList }));
        } else {
          setUserAnswers(prev => ({ ...prev, [currentQuestion.id]: optionId }));
        }
      };

      const handleNATChange = (val) => {
        if (currentEvaluation || isQuizSubmitted || isSubmitting || !currentQuestion) return;
        setUserAnswers(prev => ({ ...prev, [currentQuestion.id]: val }));
      };

      const handleSubmitAnswer = async () => {
        if (!currentQuestion || currentAnswer === undefined || isSubmitting || isQuizSubmitted) return;
        
        if (currentQuestion.questionType === 'MSQ' && (!Array.isArray(currentAnswer) || currentAnswer.length === 0)) {
          alert('Please select at least one option for this MSQ question.');
          return;
        }

        if (currentQuestion.questionType === 'NAT' && (currentAnswer === '' || currentAnswer === null)) {
          alert('Please enter a numerical answer.');
          return;
        }

        setIsSubmitting(true);
        try {
          const res = await fetch(`${API_BASE}/api/questions/${encodeURIComponent(currentQuestion.id)}/answer`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ answer: currentAnswer }),
          });
          const json = await res.json();
          if (json.success && json.data) {
            setEvaluations(prev => ({ ...prev, [currentQuestion.id]: json.data }));
          } else {
            alert(json.error || 'Evaluation failed');
          }
        } catch (err) {
          alert('Submission error: ' + err.message);
        } finally {
          setIsSubmitting(false);
        }
      };

      const handleNextQuestion = () => {
        if (currentIndex < questions.length - 1) {
          setCurrentIndex(currentIndex + 1);
        } else {
          setIsModalOpen(true);
        }
      };

      const handlePreviousQuestion = () => {
        if (currentIndex > 0) {
          setCurrentIndex(currentIndex - 1);
        }
      };

      const handleJump = (idx) => {
        if (idx >= 0 && idx < questions.length) {
          setCurrentIndex(idx);
        }
      };

      const handleConfirmSubmitQuiz = () => {
        setIsModalOpen(false);
        setIsQuizSubmitted(true);
      };

      const answeredCount = Object.keys(evaluations).length;
      const totalQuestions = questions.length;
      const unansweredCount = totalQuestions - answeredCount;
      const correctCount = Object.values(evaluations).filter(e => e.isCorrect).length;
      const incorrectCount = answeredCount - correctCount;
      const accuracy = answeredCount > 0 ? Math.round((correctCount / answeredCount) * 100) : 0;

      const totalMarks = useMemo(() => {
        let marks = 0;
        for (const evalItem of Object.values(evaluations)) {
          if (evalItem.isCorrect) {
            marks += 1.0;
          } else {
            if (evalItem.questionType === 'MCQ') {
              marks -= 0.33;
            }
          }
        }
        return marks.toFixed(2);
      }, [evaluations]);

      if (isLoading) {
        return (
          <div className="max-w-4xl mx-auto px-4 py-20 text-center">
            <div className="inline-block p-4 rounded-2xl bg-slate-900 border border-slate-800 shadow-xl mb-4">
              <div className="w-8 h-8 border-2 border-brand-500 border-t-transparent rounded-full animate-spin mx-auto" />
            </div>
            <h3 className="text-lg font-bold text-white mb-1">Loading GATE Practice Engine</h3>
            <p className="text-xs text-slate-400 font-mono">Loading questions with LaTeX mathematical support...</p>
          </div>
        );
      }

      if (error || questions.length === 0) {
        return (
          <div className="max-w-xl mx-auto px-4 py-20 text-center">
            <div className="p-6 rounded-2xl bg-rose-950/30 border border-rose-800/80 shadow-2xl">
              <h3 className="text-lg font-bold text-white mb-2">Practice Session Unavailable</h3>
              <p className="text-xs text-rose-300/80 mb-6">{error || 'No questions loaded.'}</p>
              <div className="flex flex-col sm:flex-row items-center justify-center gap-3">
                <button onClick={loadQuestions} className="px-4 py-2 rounded-xl text-xs font-semibold bg-brand-500 hover:bg-brand-400 text-white cursor-pointer transition">
                  Retry Connection
                </button>
              </div>
            </div>
          </div>
        );
      }

      // Summary View
      if (isQuizSubmitted) {
        const filteredQuestions = questions.filter(q => {
          const evalItem = evaluations[q.id];
          if (reviewFilter === 'correct') return evalItem?.isCorrect === true;
          if (reviewFilter === 'incorrect') return evalItem && evalItem.isCorrect === false;
          if (reviewFilter === 'unanswered') return !evalItem;
          return true;
        });

        return (
          <div className="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 sm:p-8 shadow-2xl mb-10">
              <div className="text-center mb-8">
                <div className="inline-flex p-3 rounded-2xl bg-brand-950/80 border border-brand-800/80 mb-3 shadow-glow">
                  <Icons.Award />
                </div>
                <h2 className="text-2xl sm:text-3xl font-extrabold text-white">GATE CS Practice Result</h2>
                <p className="text-xs text-slate-400 font-mono mt-1">Official Evaluation & Marking Breakdown</p>
              </div>

              <div className="grid grid-cols-2 sm:grid-cols-5 gap-3 mb-8">
                <div className="p-4 rounded-xl bg-slate-950 border border-slate-800 text-center">
                  <div className="text-xs font-mono uppercase text-slate-400 mb-1">Total</div>
                  <div className="text-2xl font-mono font-bold text-slate-200">{totalQuestions}</div>
                </div>
                <div className="p-4 rounded-xl bg-slate-950 border border-slate-800 text-center">
                  <div className="text-xs font-mono uppercase text-slate-400 mb-1">Attempted</div>
                  <div className="text-2xl font-mono font-bold text-brand-400">{answeredCount}</div>
                </div>
                <div className="p-4 rounded-xl bg-slate-950 border border-slate-800 text-center">
                  <div className="text-xs font-mono uppercase text-slate-400 mb-1">Unanswered</div>
                  <div className="text-2xl font-mono font-bold text-slate-400">{unansweredCount}</div>
                </div>
                <div className="p-4 rounded-xl bg-slate-950 border border-emerald-900/40 text-center">
                  <div className="text-xs font-mono uppercase text-emerald-400 mb-1">Correct</div>
                  <div className="text-2xl font-mono font-bold text-emerald-400">{correctCount}</div>
                </div>
                <div className="p-4 rounded-xl bg-slate-950 border border-rose-900/40 text-center">
                  <div className="text-xs font-mono uppercase text-rose-400 mb-1">Incorrect</div>
                  <div className="text-2xl font-mono font-bold text-rose-400">{incorrectCount}</div>
                </div>
              </div>

              <div className="p-5 rounded-xl bg-brand-950/30 border border-brand-800/40 flex flex-col sm:flex-row items-center justify-between gap-4">
                <div>
                  <div className="text-xs font-mono uppercase tracking-wider text-brand-400 font-semibold">
                    Net Score (GATE Standard Marking)
                  </div>
                  <div className="text-xs text-slate-400 mt-0.5">
                    MCQ: +1 / -0.33 | MSQ: +1 / 0 (no negative) | NAT: +1 / 0 (no negative) | Unanswered: 0
                  </div>
                </div>
                <div className="text-3xl font-mono font-extrabold text-brand-300">
                  {totalMarks} <span className="text-sm font-sans text-slate-400">/ {totalQuestions} Marks</span>
                </div>
              </div>

              <div className="flex flex-col sm:flex-row items-center justify-between gap-3 pt-6 mt-6 border-t border-slate-800">
                <button
                  onClick={loadQuestions}
                  className="w-full sm:w-auto px-5 py-2.5 rounded-xl text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 flex items-center justify-center space-x-2 cursor-pointer"
                >
                  <Icons.RotateCcw />
                  <span>Retake Practice</span>
                </button>
                <button
                  onClick={onBackToHome}
                  className="w-full sm:w-auto px-6 py-2.5 rounded-xl text-xs font-semibold bg-brand-500 hover:bg-brand-400 text-white cursor-pointer"
                >
                  Back to Overview
                </button>
              </div>
            </div>

            {/* Detailed Question Review */}
            <div className="space-y-6">
              <div className="flex flex-wrap items-center justify-between gap-3">
                <h3 className="text-lg font-bold text-white">Comprehensive Question Review</h3>
                <div className="flex items-center space-x-1.5 bg-slate-900 p-1 rounded-xl border border-slate-800 text-xs font-mono">
                  <button
                    onClick={() => setReviewFilter('all')}
                    className={`px-3 py-1 rounded-lg transition ${reviewFilter === 'all' ? 'bg-slate-800 text-white font-bold' : 'text-slate-400'}`}
                  >
                    All ({totalQuestions})
                  </button>
                  <button
                    onClick={() => setReviewFilter('correct')}
                    className={`px-3 py-1 rounded-lg transition ${reviewFilter === 'correct' ? 'bg-emerald-950 text-emerald-300 font-bold' : 'text-slate-400'}`}
                  >
                    Correct ({correctCount})
                  </button>
                  <button
                    onClick={() => setReviewFilter('incorrect')}
                    className={`px-3 py-1 rounded-lg transition ${reviewFilter === 'incorrect' ? 'bg-rose-950 text-rose-300 font-bold' : 'text-slate-400'}`}
                  >
                    Incorrect ({incorrectCount})
                  </button>
                  <button
                    onClick={() => setReviewFilter('unanswered')}
                    className={`px-3 py-1 rounded-lg transition ${reviewFilter === 'unanswered' ? 'bg-slate-800 text-slate-300 font-bold' : 'text-slate-400'}`}
                  >
                    Unanswered ({unansweredCount})
                  </button>
                </div>
              </div>

              {filteredQuestions.map((q) => {
                const evalItem = evaluations[q.id];
                const isAttempted = !!evalItem;
                const isCorrect = evalItem?.isCorrect;

                return (
                  <div key={q.id} className="bg-slate-900/80 border border-slate-800 rounded-2xl p-6 shadow-md">
                    <div className="flex flex-wrap items-center justify-between gap-2 mb-4 pb-3 border-b border-slate-800/80">
                      <div className="flex items-center space-x-2">
                        <span className="text-xs font-mono font-bold text-slate-400">Q{questions.findIndex(item => item.id === q.id) + 1}</span>
                        <ExamBadge label={q.questionType} variant="type" questionType={q.questionType} />
                        <ExamBadge label={q.subject} variant="subject" />
                        <ExamBadge label={q.difficulty} variant="difficulty" difficulty={q.difficulty} />
                      </div>

                      <div>
                        {!isAttempted ? (
                          <span className="px-2.5 py-1 rounded-md text-xs font-mono bg-slate-800 text-slate-400 border border-slate-700">
                            Unanswered (0 Marks)
                          </span>
                        ) : isCorrect ? (
                          <span className="px-2.5 py-1 rounded-md text-xs font-mono bg-emerald-950 text-emerald-400 border border-emerald-800 font-bold">
                            Correct (+1.00 Marks)
                          </span>
                        ) : (
                          <span className="px-2.5 py-1 rounded-md text-xs font-mono bg-rose-950 text-rose-400 border border-rose-800 font-bold">
                            {q.questionType === 'MCQ' ? 'Incorrect (-0.33 Marks)' : 'Incorrect (0.00 Marks)'}
                          </span>
                        )}
                      </div>
                    </div>

                    <div className="text-base text-slate-100 mb-4 leading-relaxed">
                      <MathText content={q.question} />
                    </div>

                    {q.options && q.options.length > 0 && (
                      <div className="space-y-2 mb-4">
                        {q.options.map(opt => {
                          const isCorrectOpt = Array.isArray(q.correctAnswer) ? q.correctAnswer.includes(opt.id) : q.correctAnswer === opt.id;
                          const isUserSelected = isAttempted && (Array.isArray(evalItem.userAnswer) ? evalItem.userAnswer.includes(opt.id) : evalItem.userAnswer === opt.id);

                          let optStyles = 'bg-slate-950/60 border-slate-800 text-slate-300';
                          if (isCorrectOpt) {
                            optStyles = 'bg-emerald-950/30 border-emerald-600/80 text-emerald-100 font-semibold';
                          } else if (isUserSelected && !isCorrectOpt) {
                            optStyles = 'bg-rose-950/30 border-rose-600/80 text-rose-100 line-through';
                          }

                          return (
                            <div key={opt.id} className={`p-3 rounded-xl border text-xs flex items-start space-x-3 ${optStyles}`}>
                              <span className="font-mono font-bold">{opt.id}.</span>
                              <div className="flex-1"><MathText content={opt.text} /></div>
                              {isCorrectOpt && <span className="text-emerald-400 text-[10px] uppercase font-mono font-bold">Correct Option</span>}
                            </div>
                          );
                        })}
                      </div>
                    )}

                    {q.questionType === 'NAT' && (
                      <div className="p-3.5 rounded-xl bg-slate-950 border border-slate-800 font-mono text-xs mb-4 flex items-center justify-between">
                        <div>Your Entry: <strong className="text-white">{evalItem ? String(evalItem.userAnswer) : 'Not Answered'}</strong></div>
                        <div>Correct Expected: <strong className="text-emerald-400">{String(q.correctAnswer)}</strong></div>
                      </div>
                    )}

                    <div className="bg-slate-950/60 rounded-xl p-4 border border-slate-800/80 text-xs leading-relaxed text-slate-300">
                      <div className="font-mono uppercase font-bold text-slate-400 mb-1.5 flex items-center space-x-1.5">
                        <Icons.BookOpen />
                        <span>Solution & Derivation:</span>
                      </div>
                      <MathText content={q.explanation} />
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        );
      }

      // Active Practice
      const percentage = Math.round(((currentIndex + 1) / totalQuestions) * 100);
      const isMSQ = currentQuestion?.questionType === 'MSQ';
      const isNAT = currentQuestion?.questionType === 'NAT';
      const isCurrentAnswered = currentEvaluation !== null;
      const hasSelectedAnswer = isMSQ ? (Array.isArray(currentAnswer) && currentAnswer.length > 0) : (currentAnswer !== undefined && currentAnswer !== '');

      return (
        <div className="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
          <SubmitQuizModal
            isOpen={isModalOpen}
            unansweredCount={unansweredCount}
            onConfirm={handleConfirmSubmitQuiz}
            onCancel={() => setIsModalOpen(false)}
          />

          <div className="flex items-center justify-between mb-4">
            <button onClick={onBackToHome} className="inline-flex items-center space-x-1.5 text-xs font-medium text-slate-400 hover:text-slate-200 cursor-pointer">
              <Icons.ChevronLeft />
              <span>Back to Home</span>
            </button>

            <button
              onClick={() => setIsModalOpen(true)}
              className="inline-flex items-center space-x-1.5 px-3 py-1.5 rounded-xl bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 border border-amber-500/30 text-xs font-mono font-bold transition cursor-pointer"
            >
              <Icons.Flag />
              <span>Submit Quiz ({answeredCount}/{totalQuestions} Answered)</span>
            </button>
          </div>

          <div className="w-full bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-sm mb-6">
            <div className="flex flex-wrap items-center justify-between gap-2 mb-2.5">
              <div className="flex items-center space-x-2">
                <span className="text-xs font-mono font-semibold uppercase tracking-wider text-brand-400">Progress</span>
                <span className="text-slate-400 text-xs">/</span>
                <span className="text-sm font-semibold text-slate-200">
                  Question <span className="text-brand-400 font-mono font-bold">{currentIndex + 1}</span> of <span className="font-mono">{totalQuestions}</span>
                </span>
              </div>
              <div className="flex items-center space-x-4 text-xs font-mono">
                <span className="text-slate-300">Answered: {answeredCount}/{totalQuestions}</span>
                {answeredCount > 0 && <span className="text-emerald-400 font-medium">Score: {correctCount}/{answeredCount}</span>}
                <span className="text-slate-400 font-bold">{percentage}%</span>
              </div>
            </div>
            <div className="relative w-full h-2 bg-slate-800 rounded-full overflow-hidden">
              <div className="h-full bg-gradient-to-r from-brand-600 to-indigo-500 rounded-full transition-all duration-300" style={{ width: `${percentage}%` }} />
            </div>
          </div>

          {/* Quick Jump Strip */}
          <div className="mb-6 p-3 rounded-xl bg-slate-900/60 border border-slate-800 overflow-x-auto">
            <div className="flex items-center space-x-2 min-w-max">
              <span className="text-[11px] font-mono text-slate-400 mr-2 uppercase font-semibold">Quick Jump:</span>
              {questions.map((q, idx) => {
                const isCurrent = idx === currentIndex;
                const evalItem = evaluations[q.id];
                const hasInput = userAnswers[q.id] !== undefined && userAnswers[q.id] !== '' && (!Array.isArray(userAnswers[q.id]) || userAnswers[q.id].length > 0);

                let itemStyles = 'bg-slate-800 text-slate-400 border-slate-700 hover:bg-slate-700';
                if (evalItem) {
                  itemStyles = evalItem.isCorrect ? 'bg-emerald-950 text-emerald-300 border-emerald-700 font-bold' : 'bg-rose-950 text-rose-300 border-rose-700 font-bold';
                } else if (hasInput) {
                  itemStyles = 'bg-brand-950 text-brand-300 border-brand-700 font-bold';
                }

                if (isCurrent) itemStyles += ' ring-2 ring-brand-400 font-extrabold shadow-glow';

                return (
                  <button
                    key={q.id}
                    onClick={() => handleJump(idx)}
                    className={`w-7 h-7 rounded-lg border font-mono text-xs transition flex items-center justify-center cursor-pointer ${itemStyles}`}
                    title={`Q${idx + 1} (${q.questionType}) - ${q.subject}`}
                  >
                    {idx + 1}
                  </button>
                );
              })}
            </div>
          </div>

          {/* Question Card */}
          {currentQuestion && (
            <div className="bg-slate-900/90 border border-slate-800 rounded-2xl shadow-xl overflow-hidden backdrop-blur-sm">
              <div className="p-5 border-b border-slate-800 bg-slate-900/50 flex flex-wrap items-center justify-between gap-3">
                <div className="flex flex-wrap items-center gap-2">
                  <ExamBadge label={currentQuestion.exam || 'GATE CS'} variant="primary" />
                  <ExamBadge label={currentQuestion.questionType} variant="type" questionType={currentQuestion.questionType} />
                  <ExamBadge label={currentQuestion.subject} variant="subject" />
                  <ExamBadge label={currentQuestion.difficulty} variant="difficulty" difficulty={currentQuestion.difficulty} />
                </div>
                <div className="text-xs text-slate-400 font-mono px-2 py-0.5 rounded bg-slate-800/60 border border-slate-700/60">
                  {currentQuestion.topic}
                </div>
              </div>

              <div className="p-6 md:p-8">
                <div className="text-base md:text-lg leading-relaxed text-slate-100 font-normal mb-8">
                  <MathText content={currentQuestion.question} />
                </div>

                {!isNAT && currentQuestion.options && (
                  <div className="space-y-3 mb-8">
                    <div className="text-xs font-mono uppercase tracking-wider text-slate-400 font-semibold mb-2 flex items-center justify-between">
                      <span>{isMSQ ? 'Select one or more options (MSQ):' : 'Select one option (MCQ):'}</span>
                      {isMSQ && <span className="text-purple-400 text-[11px] lowercase">multiple options may be correct</span>}
                    </div>
                    {currentQuestion.options.map((option) => {
                      const isSelected = isMSQ
                        ? Array.isArray(currentAnswer) && currentAnswer.includes(option.id)
                        : currentAnswer === option.id;

                      const isUserSelection = currentEvaluation !== null
                        ? (Array.isArray(currentEvaluation.userAnswer)
                            ? currentEvaluation.userAnswer.includes(option.id)
                            : currentEvaluation.userAnswer === option.id)
                        : false;

                      const isCorrectOption = currentEvaluation !== null
                        ? (Array.isArray(currentEvaluation.correctAnswer)
                            ? currentEvaluation.correctAnswer.includes(option.id)
                            : currentEvaluation.correctAnswer === option.id)
                        : null;

                      return (
                        <OptionCard
                          key={option.id}
                          option={option}
                          isMSQ={isMSQ}
                          isSelected={isSelected}
                          isSubmitted={isCurrentAnswered}
                          isCorrectOption={isCorrectOption}
                          isUserSelection={isUserSelection}
                          onSelect={handleSelectOption}
                          disabled={isSubmitting}
                        />
                      );
                    })}
                  </div>
                )}

                {isNAT && (
                  <div className="mb-8">
                    <NATInput
                      value={currentAnswer}
                      onChange={handleNATChange}
                      isSubmitted={isCurrentAnswered}
                      evaluation={currentEvaluation}
                      onSubmit={handleSubmitAnswer}
                      isSubmitting={isSubmitting}
                    />
                  </div>
                )}

                {currentEvaluation && <ExplanationCard evaluation={currentEvaluation} />}

                <div className="mt-8 pt-6 border-t border-slate-800 flex flex-wrap items-center justify-between gap-4">
                  <div className="flex items-center space-x-3">
                    <button
                      type="button"
                      onClick={handlePreviousQuestion}
                      disabled={currentIndex === 0 || isSubmitting}
                      className="inline-flex items-center space-x-1.5 px-4 py-2.5 rounded-xl text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-300 disabled:opacity-40 border border-slate-700 transition cursor-pointer disabled:cursor-not-allowed"
                    >
                      <Icons.ChevronLeft />
                      <span>Previous</span>
                    </button>

                    <button
                      type="button"
                      onClick={handleNextQuestion}
                      disabled={isSubmitting}
                      className="inline-flex items-center space-x-1.5 px-4 py-2.5 rounded-xl text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition cursor-pointer"
                      title="Move to next question without answering"
                    >
                      <span>{currentIndex < totalQuestions - 1 ? (isCurrentAnswered ? 'Next Question' : 'Next / Skip') : 'Review / Finish'}</span>
                      <Icons.ChevronRight />
                    </button>
                  </div>

                  <div className="flex items-center space-x-3">
                    {!isCurrentAnswered ? (
                      <button
                        type="button"
                        onClick={handleSubmitAnswer}
                        disabled={!hasSelectedAnswer || isSubmitting}
                        className="inline-flex items-center space-x-2 px-6 py-2.5 rounded-xl text-sm font-semibold bg-brand-500 hover:bg-brand-400 text-white shadow-lg shadow-brand-500/25 disabled:opacity-40 disabled:hover:bg-brand-500 transition-all cursor-pointer disabled:cursor-not-allowed"
                      >
                        {isSubmitting ? (
                          <span>Evaluating...</span>
                        ) : (
                          <>
                            <Icons.Send />
                            <span>Submit Answer</span>
                          </>
                        )}
                      </button>
                    ) : (
                      <button
                        type="button"
                        onClick={handleNextQuestion}
                        className="inline-flex items-center space-x-2 px-6 py-2.5 rounded-xl text-sm font-semibold bg-brand-500 hover:bg-brand-400 text-white shadow-lg shadow-brand-500/25 transition-all cursor-pointer"
                      >
                        <span>{currentIndex < totalQuestions - 1 ? 'Next Question' : 'View Results'}</span>
                        <Icons.ChevronRight />
                      </button>
                    )}
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // AI Practice Page (Checkpoint 4B Multi-Question Session)
    function AIPracticePage({ onBackToHome }) {
      const TECHNICAL_GATE_SUBJECTS = [
        'Databases',
        'Operating Systems',
        'Algorithms',
        'Data Structures',
        'Programming',
        'Theory of Computation',
        'Computer Networks',
        'Computer Organization and Architecture',
        'Digital Logic',
        'Compiler Design',
        'Discrete Mathematics',
        'Engineering Mathematics',
      ];

      const LOADING_STAGES = [
        'Preparing your AI practice set...',
        'Analyzing relevant GATE patterns...',
        'Generating verified questions with bounded retries...',
        'Checking correctness & originality safeguards...',
      ];

      // Configuration State
      const [subject, setSubject] = useState('Databases');
      const [topic, setTopic] = useState('Any Topic');
      const [availableTopics, setAvailableTopics] = useState([]);
      const [difficulty, setDifficulty] = useState('Medium');
      const [questionType, setQuestionType] = useState('Mixed');
      const [questionCount, setQuestionCount] = useState(3);

      // Session State
      const [isGenerating, setIsGenerating] = useState(false);
      const [loadingStageIndex, setLoadingStageIndex] = useState(0);
      const [generationError, setGenerationError] = useState(null);

      const [sessionId, setSessionId] = useState(null);
      const [questions, setQuestions] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [answers, setAnswers] = useState({});

      // Submission & Results
      const [isSubmittingQuiz, setIsSubmittingQuiz] = useState(false);
      const [submissionResult, setSubmissionResult] = useState(null);
      const [submissionError, setSubmissionError] = useState(null);
      const [showConfirmModal, setShowConfirmModal] = useState(false);
      const [showTransparency, setShowTransparency] = useState(false);

      const loadingTimerRef = useRef(null);

      // Load topics for selected subject
      useEffect(() => {
        let isMounted = true;
        fetch(`${API_BASE}/api/taxonomy/topics?subject=${encodeURIComponent(subject)}`)
          .then(res => res.json())
          .then(data => {
            if (isMounted && data.success && Array.isArray(data.data)) {
              setAvailableTopics(data.data);
              setTopic('Any Topic');
            }
          })
          .catch(err => console.error('Failed to load topics:', err));
        return () => { isMounted = false; };
      }, [subject]);

      // Loading stage animation timer
      useEffect(() => {
        if (isGenerating) {
          setLoadingStageIndex(0);
          const stageIntervals = [3000, 4000, 5000];
          let currentStage = 0;
          const scheduleNextStage = () => {
            if (currentStage < LOADING_STAGES.length - 1) {
              const timeout = stageIntervals[currentStage] || 3500;
              loadingTimerRef.current = setTimeout(() => {
                currentStage++;
