services:
  - type: web
    name: gateforge
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GROQ_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: TUTOR_SERVICE_URL
        sync: false

  - type: web
    name: gateforge-tutor
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r ai_tutor/requirements.txt
    startCommand: python -m ai_tutor.main
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.8
